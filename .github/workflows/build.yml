name: CEF runtime
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    steps:
      - name: Install build and runtime dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates git build-essential meson ninja-build python3 libx11-dev \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxcomposite1 \
            libxdamage1 libxrandr2 libatk-bridge2.0-0 libxkbcommon0 xvfb xauth
      - uses: actions/checkout@v7
      - name: Compile transport and host against prebuilt CEF
        run: python3 scripts/build.py --arch '${{ matrix.arch }}'
      - name: Check staged runtime
        run: python3 scripts/check-runtime.py
      - name: Exercise off-screen rendering and input
        env:
          WEBBROWSER_RUNTIME: .build/stage/runtime
          # Containers cannot use the host's Chromium user-namespace sandbox.
          # This only affects the trusted local HTML fixture in this test.
          WB_TEST_NO_SANDBOX: '1'
        run: |
          xvfb-run -a python3 scripts/smoke.py
          xvfb-run -a python3 scripts/concurrent-smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: webbrowser-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64-darwin
          - runner: macos-15-intel
            arch: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: brew install meson ninja
      - name: Compile transport and host against prebuilt CEF
        run: python3 scripts/build.py --arch '${{ matrix.arch }}'
      - name: Check staged runtime and app signature
        run: |
          python3 scripts/check-runtime.py
          codesign --verify --deep --strict .build/stage/runtime/webbrowser-host.app
      - uses: actions/upload-artifact@v7
        with:
          name: webbrowser-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install meson ninja
      - name: Compile transport and host against prebuilt CEF
        run: python scripts/build.py --arch x86_64-windows
      - name: Check staged runtime
        run: python scripts/check-runtime.py
      - uses: actions/upload-artifact@v7
        with:
          name: webbrowser-x86_64-windows
          path: dist/*
          if-no-files-found: error
  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: webbrowser-*
          merge-multiple: true
          path: artifacts
      - name: Verify version and runtime checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import json,os; assert os.environ["TAG"] == "v" + json.load(open("manifest.json"))["addons"][0]["version"]'
          cd artifacts
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
      - name: Publish binary runtimes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" \
              --notes 'Prebuilt CEF runtimes for Pragtical Web Browser. License notices are included in each runtime.'
          fi
